name: Bug report
description: Report something that is not working correctly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command you said or typed.
      placeholder: |
        1. Start JARVIS with ...
        2. Say or type ...
        3. See ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13
  - type: textarea
    id: logs
    attributes:
      label: Relevant terminal output
      render: text
